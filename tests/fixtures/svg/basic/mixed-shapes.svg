<!-- One document holding every element type the importer handles.
     6 curves: line, polyline, polygon, rect, circle, path. -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <line x1="0" y1="0" x2="50" y2="0"/>
  <polyline points="0,10 20,10 20,30"/>
  <polygon points="60,0 90,0 90,30 60,30"/>
  <rect x="100" y="0" width="40" height="25"/>
  <circle cx="160" cy="20" r="15"/>
  <path d="M 0 60 L 40 60 L 40 100 Z"/>
</svg>
