# Workspace configuration: Needed for rust-analyzer to find Cargo.toml of the meshup Rust crate
[workspace]
members = [
    "./rust",
    "./rust/geo-buf",
]
exclude = [
    "./rust/hypercurve",
    "./rust/hyperreal",
    "./rust/hypersolve",
    "./rust/hyperlattice",
    "./rust/hyperlimit",
]
resolver = "2"

# The ArchiyouApp hypercurve fork (fillet/chamfer + elliptical arcs) tracks
# timschmidt/hypercurve main, which needs hyperreal and hypersolve versions that are
# not published yet — they live on their upstream mains. Patch every crates.io
# reference (hypercurve/hypersolve/hyperlimit) to the local submodule checkouts.
# TODO: drop these patches once matching hyperreal/hypersolve/hypercurve releases
# are published.
[patch.crates-io]
hyperreal = { path = "rust/hyperreal" }
hypersolve = { path = "rust/hypersolve" }
hyperlattice = { path = "rust/hyperlattice" }
hyperlimit = { path = "rust/hyperlimit" }
