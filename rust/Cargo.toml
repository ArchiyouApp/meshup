[package]
name = "meshup"
version = "0.21.0"
edition = "2024"
description = "Meshup: broad general-purpose 3D mesh library (CSG/SDF/quasi-CAD) engine, forked from csgrs"
authors = ["Mark van der Net (Archiyou)", "Timothy Schmidt <timschmidt@gmail.com>"]
# msrv
rust-version = "1.85.1"

license = "MIT"
repository = "https://github.com/ArchiyouApp/meshup"
readme = "readme.md"

keywords = ["geometry", "physics", "csg", "slicing", "offsetting"]
categories = ["game-development", "graphics", "mathematics", "simulation", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
debug = false
debug-assertions = false
overflow-checks = false

[profile.embedded]
inherits = "release"
opt-level = "z"

[dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
# geometry
nalgebra = { version = "=0.34.1", features = ["serde-serialize"] }
# planar exact-arithmetic curve kernel (replacing curvo).
# Using the ArchiyouApp fork (submodule at ./hypercurve) which adds fillet/chamfer
# ahead of the crates.io release. TODO: switch back to `version = "0.3"` (or newer)
# once those land in a published hypercurve crate.
hypercurve = { path = "hypercurve" }
#alum = "0.6.1"
robust = { version = "1.1.0", default-features = false, features = ["no_std"] }
geo = { version = "0.31.0", default-features = false, features = ["use-serde"] }
#geo-booleanop = "0.3.2" # alternative boolean implementation has fewer dependencies
chull = { version = "0.2.4", optional = true }
spade = { version = "2.15.0", optional = true }
earcutr = { version = "0.5.0", optional = true }
boolmesh = { version = "0.1.9", optional = true }

rapier3d-f64 = { version = "0.31.0", optional = true }
rapier3d = { version = "0.31.0", optional = true }
parry3d-f64  = { version = "0.25.3", optional = true }
parry3d  = { version = "0.25.3", optional = true }

# bevy mesh conversion
bevy_mesh = { version = "0.17", optional = true }
bevy_asset = { version = "0.17", optional = true }
wgpu-types = { version = "24", optional = true, default-features = false }

# utils
rayon = { version = "1.10", optional = true }
thiserror = "2.0"
hashbrown = { version = "0.15" }
fast-surface-nets = { version = "0.2.1", optional = true }
contour_tracing = { version = "1.0.12", features = ["array"], optional = true }
either = "1.15"
base64 = { version = "0.22", optional = true }
# NOTE: no "import" feature. It exists to resolve buffers *and decode textures*, so it
# depends on `image` — every codec (JPEG/PNG/TIFF/WebP/OpenEXR/GIF), ~1.3 MB of wasm — to
# produce images `from_gltf` discards. `io/gltf.rs` resolves buffers itself instead.
gltf = { version = "1.4", optional = true, default-features = false, features = ["utils"] }
# doc
#doc-image-embed = "0.2" # fork of https://crates.io/crates/embed-doc-image - should be upstreamed.

# io/load
# core2 = { version = "0.4.0", default_features = false, features = ["alloc"] } # no-std, still throws errors
core2 = { version = "0.4", features = ["alloc"] }
# 0.6.1 is a size floor, not a whim: 0.6.0 depends on `image` with its default features,
# which builds every decoder (JPEG/TIFF/WebP/OpenEXR/…) into the wasm to read a DXF's BMP
# thumbnail preview. 0.6.1 narrowed that to `default-features = false, features = ["bmp"]`.
dxf = { version = "0.6.1", optional = true }
stl_io = { version = "0.8", optional = true }
image = { version = "0.25", optional = true }
svg = { version = "0.18", optional = true }
nom = { version = "7.1", optional = true }
roxmltree = { version = "0.20", optional = true }
zip = { version = "2.2", optional = true, default-features = false, features = ["deflate"] }

# font
ttf-utils = { version = "0.1", optional = true, package = "ttf-parser-utils"}
ttf-parser = { version = "0.25", optional = true }
hershey = { version = "0.1.2", optional = true }

doc-image-embed = "0.2.1"

# wasm
uuid = { version = "1.18", features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3.81", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
serde_json = { version = "1.0.145", optional = true }
serde = { version = "1.0.228", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.18", features = ["js"] }

[features]
default = ["f64", "bmesh", "mesh", "sketch", "stl-io", "dxf-io", "obj-io", "ply-io", "amf-io", "threemf-io", "gltf-io", "chull-io", "image-io", "metaballs", "sdf", "delaunay", "truetype-text", "hershey-text"]
parallel = [
  "rayon",
  "geo/multithreading",
  "hashbrown/rayon",
  "parry3d?/parallel",
  "parry3d-f64?/parallel",
  "rapier3d?/parallel",
  "rapier3d-f64?/parallel"
]
f64 = [
  "rapier3d-f64",
  "parry3d-f64",
]
f32 = [
  "rapier3d",
  "parry3d",
]
mesh = [
  # BSP backed Mesh datatype
]
mesh-bbopt = [
  # Enable bounding box optimization for Mesh BSP
]
sketch = [
  # geo backed Sketch datatype
]
bmesh = [
  "boolmesh",
]
# convex hull and minkowski sum
chull-io = [
  "chull",
]
stl-io = [
  "stl_io",
]
svg-io = [
  "svg",
  "nom", # Parsing of things not covered by the `svg` crate
  "hypercurve/svg", # hypercurve's curve-aware SVG path import (svg_io)
]
dxf-io = [
  "dxf",
]
obj-io = [
  # OBJ format support - no external dependencies needed
]
ply-io = [
  # PLY format support - no external dependencies needed
]
amf-io = [
  "roxmltree",
  "zip",
]
threemf-io = [
  "roxmltree",
  "zip",
]
gltf-io = [
  "base64",
  "gltf",
]
truetype-text = [
  "ttf-parser",
  "ttf-utils",
]
hershey-text = [
  "hershey",
]
image-io = [
  "image",
  "contour_tracing",
  "svg-io",
]
metaballs = [
  "fast-surface-nets",
]
sdf = [
  "fast-surface-nets",
]
delaunay = [
  "spade",
  "geo/spade",
]
earcut = [
  "earcutr",
  "geo/earcutr",
]
bevymesh = [
  "dep:bevy_mesh",
  "dep:bevy_asset",
  "dep:wgpu-types"
]
# The feature set of the shipped wasm module. buildscripts/build-wasm.ts builds with
# `--no-default-features --features wasm`, so this list — not `default` — decides what
# ends up in the binary users download. Keep it to what src/wasm/ actually binds.
#
# Deliberately NOT here: "image-io". It builds `Sketch::from_image`, which no wasm
# binding exposes, and drags in the `image` crate's full codec set (~1.3 MB of wasm).
# Note that "svg-io" used to arrive only as a transitive dep of "image-io" — it is
# required by curve_js.rs and is now listed on its own.
wasm = [
  "uuid",
  "wasm-bindgen",
  "js-sys",
  "serde-wasm-bindgen",
  "serde_json",
  "serde",
  "console_error_panic_hook",
  "getrandom",
  # geometry kernels
  "f64",
  "bmesh",
  "mesh",
  "sketch",
  "chull-io",
  "metaballs",
  "sdf",
  "delaunay",
  # file formats
  "stl-io",
  "dxf-io",
  "obj-io",
  "ply-io",
  "amf-io",
  "threemf-io",
  "gltf-io",
  "svg-io",
  # text
  "truetype-text",
  "hershey-text",
]
spade = ["dep:spade"]
boolmesh = ["dep:boolmesh"]
parry3d-f64 = ["dep:parry3d-f64"]
parry3d = ["dep:parry3d"]
rapier3d-f64 = ["dep:rapier3d-f64"]
rapier3d = ["dep:rapier3d"]
